apiVersion: v1
kind: Namespace
metadata:
  name: cluster-access-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-access-gateway
  namespace: cluster-access-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cluster-access-gateway-data
  namespace: cluster-access-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-access-gateway-inventory
rules:
  - apiGroups: [multicluster.x-k8s.io]
    resources: [clusterprofiles]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [clusterprofiles/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-access-gateway-impersonator
rules:
  - apiGroups: [""]
    resources: [users]
    verbs: [impersonate]
  - apiGroups: [""]
    resources: [groups]
    resourceNames: [cluster-access:agents:read, cluster-access:agents:write]
    verbs: [impersonate]
  - apiGroups: [authentication.k8s.io]
    resources:
      - userextras/cluster-access.io/agent-issuer
      - userextras/cluster-access.io/agent-subject
      - userextras/cluster-access.io/controller-subject
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-access-gateway-inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-access-gateway-inventory
subjects:
  - kind: ServiceAccount
    name: cluster-access-gateway
    namespace: cluster-access-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-access-gateway-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-access-gateway-impersonator
subjects:
  - kind: ServiceAccount
    name: cluster-access-gateway
    namespace: cluster-access-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-access-gateway
  namespace: cluster-access-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-access-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-access-gateway
    spec:
      serviceAccountName: cluster-access-gateway
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: gateway
          image: cluster-access-gateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_ADDRESS
              value: :8080
            - name: GATEWAY_DATABASE_DSN
              value: /data/gateway.db
            - name: GATEWAY_PUBLIC_URL
              value: http://127.0.0.1:18081
            - name: GATEWAY_INVENTORY_ACCESS_URL
              value: http://cluster-access-gateway.cluster-access-system.svc:8080
            - name: OIDC_ISSUER
              value: https://identity.example.com
            - name: OIDC_AUDIENCE
              value: kubernetes-dashboard-client
            - name: CATALOG_ADMIN_GROUPS
              value: platform-admins
            - name: RESOURCE_SERVER_URL
              value: http://127.0.0.1:18081/api/agent
            - name: RESOURCE_SERVER_ISSUER
              value: https://identity.example.com
            - name: RESOURCE_SERVER_AUTHORIZED_CLIENT_IDS
              value: agent-client
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cluster-access-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-access-gateway
  namespace: cluster-access-system
spec:
  selector:
    app.kubernetes.io/name: cluster-access-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
