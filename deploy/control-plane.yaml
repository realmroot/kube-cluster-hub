apiVersion: v1
kind: Namespace
metadata:
  name: kube-cluster-hub-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-cluster-hub
  namespace: kube-cluster-hub-system
data:
  HUB_PUBLIC_URL: https://clusters.example.com
  HUB_UI_CLIENT_ID: kubernetes-client
  OIDC_ISSUER: https://identity.example.com
  KUBERNETES_OIDC_AUDIENCE: kubernetes-client
  OIDC_GROUPS_CLAIM: groups
  CATALOG_ADMIN_GROUPS: platform-admins
  RESOURCE_SERVER_URL: https://clusters.example.com/api/agent
  RESOURCE_SERVER_ISSUER: https://identity.example.com
  RESOURCE_SERVER_AUTHORIZED_CLIENT_IDS: authorized-toolbox-client
  RESOURCE_SERVER_JWT_ALGORITHMS: RS256
  AUDIT_RETENTION: 2160h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-cluster-hub
  namespace: kube-cluster-hub-system
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-cluster-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-cluster-hub
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hub
          image: kube-cluster-hub:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kube-cluster-hub
          env:
            - name: PORT
              value: "8080"
            - name: HUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kube-cluster-hub-secrets
                  key: database-url
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kube-cluster-hub
  namespace: kube-cluster-hub-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-cluster-hub
---
apiVersion: v1
kind: Service
metadata:
  name: kube-cluster-hub
  namespace: kube-cluster-hub-system
spec:
  selector:
    app.kubernetes.io/name: kube-cluster-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
