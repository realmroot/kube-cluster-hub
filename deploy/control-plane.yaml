apiVersion: v1
kind: Namespace
metadata:
  name: kube-cluster-hub-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-cluster-hub-data
  namespace: kube-cluster-hub-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-cluster-hub
  namespace: kube-cluster-hub-system
data:
  HUB_PUBLIC_URL: https://clusters.example.com
  HUB_INVENTORY_ACCESS_URL: https://clusters.example.com
  OIDC_ISSUER: https://identity.example.com
  KUBERNETES_OIDC_AUDIENCE: kubernetes-client
  OIDC_GROUPS_CLAIM: groups
  CATALOG_ADMIN_GROUPS: platform-admins
  RESOURCE_SERVER_URL: https://clusters.example.com/api/agent
  RESOURCE_SERVER_ISSUER: https://identity.example.com
  RESOURCE_SERVER_AUTHORIZED_CLIENT_IDS: authorized-toolbox-client
  RESOURCE_SERVER_JWT_ALGORITHMS: RS256
  DISPATCH_ISSUER: https://clusters.example.com
  DISPATCH_AUDIENCE: kube-cluster-connector
  INVENTORY_CLUSTER_ID: management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-cluster-hub
  namespace: kube-cluster-hub-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-cluster-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-cluster-hub
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
      containers:
        - name: control-plane
          image: kube-cluster-hub:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kube-cluster-hub
            - secretRef:
                name: kube-cluster-hub-secrets
          env:
            - name: PORT
              value: "8080"
            - name: HUB_DATABASE_DSN
              value: /data/control-plane.db
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kube-cluster-hub-data
---
apiVersion: v1
kind: Service
metadata:
  name: kube-cluster-hub
  namespace: kube-cluster-hub-system
spec:
  selector:
    app.kubernetes.io/name: kube-cluster-hub
  ports:
    - name: http
      port: 8080
      targetPort: http
