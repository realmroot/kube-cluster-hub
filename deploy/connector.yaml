apiVersion: v1
kind: Namespace
metadata:
  name: cluster-access-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-access-connector
  namespace: cluster-access-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-access-connector
rules:
  - apiGroups: [multicluster.x-k8s.io]
    resources: [clusterprofiles]
    verbs: [get, list, create, update, delete]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [clusterprofiles/status]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [users]
    resourceNames: [cluster-access:agent]
    verbs: [impersonate]
  - apiGroups: [""]
    resources: [groups]
    resourceNames: [cluster-access:agents:read, cluster-access:agents:write]
    verbs: [impersonate]
  - apiGroups: [authentication.k8s.io]
    resources:
      - userextras/cluster-access.io/agent-issuer
      - userextras/cluster-access.io/agent-subject
      - userextras/cluster-access.io/controller-subject
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-access-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-access-connector
subjects:
  - kind: ServiceAccount
    name: cluster-access-connector
    namespace: cluster-access-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-access-connector
  namespace: cluster-access-system
data:
  CONNECTOR_CLUSTER_ID: management
  CONNECTOR_ADDRESS: :8081
  DISPATCH_ISSUER: https://clusters.example.com
  DISPATCH_AUDIENCE: cluster-access-connector
  CONTROL_PLANE_URL: https://clusters.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-access-connector
  namespace: cluster-access-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-access-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-access-connector
    spec:
      serviceAccountName: cluster-access-connector
      securityContext:
        runAsNonRoot: true
      containers:
        - name: connector
          image: cluster-access-connector:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cluster-access-connector
            - secretRef:
                name: cluster-access-connector-secrets
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-access-connector
  namespace: cluster-access-system
spec:
  selector:
    app.kubernetes.io/name: cluster-access-connector
  ports:
    - name: http
      port: 8081
      targetPort: http
