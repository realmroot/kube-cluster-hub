apiVersion: v1
kind: Namespace
metadata:
  name: kube-cluster-hub-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-inventory
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-cluster-connector
  namespace: kube-cluster-hub-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-cluster-connector
rules:
  - apiGroups: [multicluster.x-k8s.io]
    resources: [clusterprofiles]
    verbs: [get, list, create, update, delete]
  - apiGroups: [multicluster.x-k8s.io]
    resources: [clusterprofiles/status]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [users]
    resourceNames: [kube-cluster-hub:agent]
    verbs: [impersonate]
  - apiGroups: [""]
    resources: [groups]
    resourceNames: [kube-cluster-hub:agents:read, kube-cluster-hub:agents:write]
    verbs: [impersonate]
  - apiGroups: [authentication.k8s.io]
    resources:
      - userextras/kube-cluster-hub.dev/agent-issuer
      - userextras/kube-cluster-hub.dev/agent-subject
      - userextras/kube-cluster-hub.dev/controller-subject
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-cluster-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-cluster-connector
subjects:
  - kind: ServiceAccount
    name: kube-cluster-connector
    namespace: kube-cluster-hub-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-cluster-connector
  namespace: kube-cluster-hub-system
data:
  CONNECTOR_CLUSTER_ID: management
  CONNECTOR_ADDRESS: :8081
  DISPATCH_ISSUER: https://clusters.example.com
  DISPATCH_AUDIENCE: kube-cluster-connector
  CONTROL_PLANE_URL: https://clusters.example.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-cluster-connector
  namespace: kube-cluster-hub-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-cluster-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-cluster-connector
    spec:
      serviceAccountName: kube-cluster-connector
      securityContext:
        runAsNonRoot: true
      containers:
        - name: connector
          image: kube-cluster-connector:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kube-cluster-connector
            - secretRef:
                name: kube-cluster-connector-secrets
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: kube-cluster-connector
  namespace: kube-cluster-hub-system
spec:
  selector:
    app.kubernetes.io/name: kube-cluster-connector
  ports:
    - name: http
      port: 8081
      targetPort: http
