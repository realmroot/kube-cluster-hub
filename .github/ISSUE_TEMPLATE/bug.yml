name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: markdown
    attributes: { value: 'Do not report security vulnerabilities here; follow SECURITY.md.' }
  - type: input
    id: version
    attributes: { label: Version, placeholder: v0.2.0 }
    validations: { required: true }
  - type: dropdown
    id: runtime
    attributes: { label: Control-plane runtime, options: [Cloudflare Workers, Docker, Kubernetes] }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction, description: Include exact steps and sanitized configuration. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs, render: shell }
