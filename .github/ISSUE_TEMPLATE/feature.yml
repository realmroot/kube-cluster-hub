name: Feature proposal
description: Propose a focused cluster catalog or access capability
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Describe the Kubernetes workflow that is currently blocked. }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: upstream
    attributes: { label: Upstream standards, description: List relevant Kubernetes, OAuth, OIDC, or HTTP standards. }
  - type: checkboxes
    id: boundaries
    attributes:
      label: Architecture boundaries
      options:
        - label: This does not require storing Kubernetes credentials.
          required: true
        - label: This does not introduce a parallel Kubernetes authorization model.
          required: true
